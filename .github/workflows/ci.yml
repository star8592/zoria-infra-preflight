name: Rust quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --locked
      - name: Frontend briefing tests
        run: |
          node --check docs/assets/brief.js
          node --check docs/assets/brief-page.js
          node --test tests/brief.test.cjs
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

name: Public site daily health

on:
  schedule:
    - cron: "17 03 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check public pages, metadata and inquiry CTA
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://star8592.github.io/zoria-infra-preflight"
          for path in "/" "/services/linux/" "/services/gpu/" "/services/ai/" "/start/" "/experience/"; do
            page=$(mktemp)
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 8 --max-time 25 "$ROOT$path" > "$page"
            test -s "$page"
            grep -q 'upwork.com/freelancers/' "$page"
            grep -q 'rel="canonical"' "$page"
            if [[ "$path" == /services/* ]]; then
              grep -q 'application/ld+json' "$page"
            fi
            rm -f "$page"
            echo "PASS $ROOT$path"
          done
          curl --fail --silent --show-error --location --retry 2 --max-time 20 "$ROOT/sitemap.xml" | grep -q "services/gpu/"
          curl --fail --silent --show-error --location --retry 2 --max-time 20 "$ROOT/robots.txt" | grep -q "Sitemap:"
          echo "Public-site read-only checks passed"
